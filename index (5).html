<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F-导航 (IE 兼容版)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #152b3e;
            background-image: url('https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #152b3e;
            cursor: default;
            flex-direction: column;
        }

        /* 主卡片：直角、无透明渐变、无圆角 */
        .glass-card {
            width: 100%;
            max-width: 780px;
            padding: 2rem 1.8rem 2rem;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffffff;
            color: #f0f7ff;
            text-align: center;
            position: relative;
            display: block;
            min-height: 50vh;
        }

        /* 问候语 */
        .greeting-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .greeting-icon {
            font-size: 2.8rem;
        }

        .greeting-title {
            font-weight: 600;
            font-size: 2.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            display: block;
            margin-top: 10px;
        }

        /* 搜索框：直角、粗白边框 */
        .search-fusion {
            width: 100%;
            max-width: 680px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 6px 6px 24px;
            border: 2px solid #ffffff;
            display: -ms-flexbox;
            display: flex;
            align-items: center;
            margin: 0 auto 20px auto;
        }

        .search-input-fusion {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 10px 14px 8px;
            font-size: 1.1rem;
            color: #ffffff;
            outline: none;
            min-width: 120px;
            letter-spacing: 0.3px;
            width: 100%;
        }

        .search-input-fusion::-ms-clear {
            display: none;
        }

        .search-input-fusion::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

        .search-btn-fusion {
            background: #ffffff;
            border: 2px solid #ffffff;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 500;
            color: #000000;
            cursor: pointer;
            display: -ms-flexbox;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-btn-fusion:hover {
            background: #dddddd;
        }

        /* 引擎选择器 */
        .engine-selector-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        .desktop-capsule {
            display: inline-block;
            background: transparent;
            border: 2px solid #ffffff;
            padding: 10px 16px;
            white-space: nowrap;
            overflow-x: auto;
            position: relative;
        }

        .engine-option {
            display: inline-block;
            padding: 8px 18px;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
        }

        .engine-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .engine-option.active {
            color: #000000;
            background: #ffffff;
        }

        /* 底部版权 */
        .footer-wrapper {
            width: 100%;
            text-align: center;
            padding: 16px 0 8px 0;
            margin-top: 20px;
        }

        .footer-studio {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            padding: 0 12px;
        }

        /* 右键菜单：直角、无动画 */
        .custom-context-menu {
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            background: #1a1f2a;
            border: 2px solid #ffffff;
            padding: 4px 0;
            min-width: 190px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.4);
            z-index: 99999;
            overflow: hidden;
            pointer-events: auto;
        }

        .custom-context-menu .menu-item {
            display: -ms-flexbox;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            font-size: 0.9rem;
            color: #f0f0f0;
            cursor: pointer;
        }

        .custom-context-menu .menu-item:hover {
            background: #ffffff;
            color: #000000;
        }

        .custom-context-menu .menu-item .icon {
            font-size: 1.1rem;
        }

        .custom-context-menu .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 4px 12px;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 12px 10px;
            }
            .glass-card {
                padding: 0.6rem 0.2rem 1.2rem;
                min-height: auto;
            }
            .greeting-header {
                margin-bottom: 12px;
            }
            .greeting-icon {
                font-size: 1.8rem;
            }
            .greeting-title {
                font-size: 1.6rem;
            }
            .search-fusion {
                padding: 4px 4px 4px 16px;
            }
            .search-input-fusion {
                font-size: 0.95rem;
                padding: 10px 6px;
                min-width: 80px;
            }
            .search-btn-fusion {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
            .desktop-capsule {
                padding: 6px 10px;
                white-space: normal;
                text-align: center;
            }
            .engine-option {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="app">
        <div class="greeting-header" id="greetingHeader">
            <span class="greeting-icon" id="greetingHeaderIcon">🌅</span>
            <span class="greeting-title" id="greetingHeaderTitle">Good morning!</span>
        </div>

        <div class="search-fusion" id="searchFusion">
            <input type="text" class="search-input-fusion" id="searchInput" placeholder="输入关键词…">
            <button class="search-btn-fusion" id="searchBtn"><span>🔍</span> 搜索</button>
        </div>

        <div class="engine-selector-wrapper">
            <div class="desktop-capsule" id="desktopEngineSelector">
                <span class="engine-option active" data-engine="bing">必应</span>
                <span class="engine-option" data-engine="baidu">百度</span>
                <span class="engine-option" data-engine="sogou">搜狗</span>
                <span class="engine-option" data-engine="google">Google</span>
                <span class="engine-option" data-engine="yahoo">雅虎</span>
                <span class="engine-option" data-engine="bilibili">哔哩哔哩</span>
                <span class="engine-option" data-engine="duckduckgo">DuckDuckGo</span>
            </div>
        </div>
    </div>

    <div class="footer-wrapper">
        <div class="footer-studio" id="footerStudio">- Finder studio 工作室制作 - V2.0</div>
    </div>

    <!-- 右键菜单 -->
    <div class="custom-context-menu" id="customContextMenu">
        <div class="menu-item" id="menuBrowser"><span class="icon">🌐</span>浏览器原生菜单</div>
        <div class="menu-item" id="menuReload"><span class="icon">🔄</span>刷新页面</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuDownloadBg"><span class="icon">🖼️</span>下载背景</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuStar"><span class="icon">⭐</span>去仓库给 Star</div>
    </div>

    <script>
        // =============================================================
        // IE 兼容版 - 仅使用 ES5 (var / function)
        // =============================================================

        var ENGINES = {
            bing: { url: 'https://www.bing.com/search?q=' },
            baidu: { url: 'https://www.baidu.com/s?wd=' },
            sogou: { url: 'https://www.sogou.com/web?query=' },
            google: { url: 'https://www.google.com/search?q=' },
            yahoo: { url: 'https://search.yahoo.com/search?p=' },
            bilibili: { url: 'https://search.bilibili.com/all?keyword=' },
            duckduckgo: { url: 'https://duckduckgo.com/?q=' }
        };

        var currentEngineKey = 'bing';
        var searchInput = document.getElementById('searchInput');
        var searchBtn = document.getElementById('searchBtn');
        var desktopEngineOptions = document.querySelectorAll('#desktopEngineSelector .engine-option');

        /* ------ 设置高亮引擎 ------ */
        function setActiveEngine(engineKey) {
            if (!ENGINES[engineKey]) return;
            if (currentEngineKey === engineKey) return;
            var i;
            for (i = 0; i < desktopEngineOptions.length; i++) {
                var opt = desktopEngineOptions[i];
                if (opt.getAttribute('data-engine') === engineKey) {
                    opt.className = 'engine-option active';
                } else {
                    opt.className = 'engine-option';
                }
            }
            currentEngineKey = engineKey;
            searchInput.focus();
        }

        /* ------ 引擎点击绑定 ------ */
        for (var i = 0; i < desktopEngineOptions.length; i++) {
            (function(index) {
                var opt = desktopEngineOptions[index];
                opt.onclick = function() {
                    var key = this.getAttribute('data-engine');
                    if (key && ENGINES[key]) {
                        setActiveEngine(key);
                    }
                };
            })(i);
        }

        /* ------ 搜索执行 ------ */
        function performSearch() {
            var query = searchInput.value.trim();
            if (!query) {
                searchInput.style.border = '1px solid rgba(255,180,180,0.4)';
                setTimeout(function() {
                    searchInput.style.border = 'none';
                }, 300);
                return;
            }
            var engine = ENGINES[currentEngineKey];
            if (!engine) return;
            window.open(engine.url + encodeURIComponent(query), '_blank');
        }

        searchBtn.onclick = function(e) {
            e.preventDefault();
            performSearch();
        };

        searchInput.onkeydown = function(e) {
            var ev = e || window.event;
            if (ev.key === 'Enter' || ev.keyCode === 13) {
                e.preventDefault();
                performSearch();
            }
            if (ev.key === 'Tab' || ev.keyCode === 9) {
                e.preventDefault();
                var engineKeys = ['bing', 'baidu', 'sogou', 'google', 'yahoo', 'bilibili', 'duckduckgo'];
                var currentIndex = engineKeys.indexOf(currentEngineKey);
                var nextIndex;
                if (ev.shiftKey) {
                    nextIndex = (currentIndex - 1 + engineKeys.length) % engineKeys.length;
                } else {
                    nextIndex = (currentIndex + 1) % engineKeys.length;
                }
                setActiveEngine(engineKeys[nextIndex]);
            }
        };

        /* ------ 问候语 ------ */
        function getGreeting() {
            var hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return { emoji: '🌅', text: 'Good morning!' };
            if (hour >= 12 && hour < 14) return { emoji: '☀️', text: 'Good noon!' };
            if (hour >= 14 && hour < 18) return { emoji: '🌤️', text: 'Good afternoon!' };
            return { emoji: '🌙', text: 'Good evening!' };
        }

        function updateGreeting() {
            var g = getGreeting();
            var icon = document.getElementById('greetingHeaderIcon');
            var title = document.getElementById('greetingHeaderTitle');
            if (icon) icon.textContent = g.emoji;
            if (title) title.textContent = g.text;
        }
        updateGreeting();

        /* ------ 右键菜单 (IE 兼容) ------ */
        var customMenu = document.getElementById('customContextMenu');
        var menuBrowser = document.getElementById('menuBrowser');
        var menuReload = document.getElementById('menuReload');
        var menuDownloadBg = document.getElementById('menuDownloadBg');
        var menuStar = document.getElementById('menuStar');

        document.oncontextmenu = function(e) {
            var ev = e || window.event;
            ev.preventDefault();
            showCustomMenu(ev.clientX, ev.clientY);
            return false;
        };

        function showCustomMenu(x, y) {
            var menuWidth = 190;
            var menuHeight = 220;
            var winWidth = window.innerWidth;
            var winHeight = window.innerHeight;

            if (x + menuWidth > winWidth) x = winWidth - menuWidth - 10;
            if (y + menuHeight > winHeight) y = winHeight - menuHeight - 10;
            if (x < 10) x = 10;
            if (y < 10) y = 10;

            customMenu.style.left = x + 'px';
            customMenu.style.top = y + 'px';
            customMenu.style.display = 'block';
        }

        function hideCustomMenu() {
            customMenu.style.display = 'none';
        }

        document.onclick = function(e) {
            var target = e.target || e.srcElement;
            if (!customMenu.contains(target)) {
                hideCustomMenu();
            }
        };

        window.onresize = function() {
            hideCustomMenu();
        };

        /* 浏览器原生菜单 */
        menuBrowser.onclick = function(e) {
            e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
            hideCustomMenu();

            var fakeEvent = document.createEvent('MouseEvents');
            fakeEvent.initMouseEvent('contextmenu', true, true, window, 0, e.clientX, e.clientY, e.clientX, e.clientY, false, false, false, false, 2, null);

            var target = document.elementFromPoint(e.clientX, e.clientY) || document.body;
            var allowOnce = true;
            var tempHandler = function(ev) {
                if (allowOnce) {
                    allowOnce = false;
                    document.oncontextmenu = null;
                    target.dispatchEvent(fakeEvent);
                    setTimeout(function() {
                        document.oncontextmenu = function(ev2) {
                            ev2.preventDefault();
                            showCustomMenu(ev2.clientX, ev2.clientY);
                            return false;
                        };
                    }, 100);
                }
            };
            document.oncontextmenu = tempHandler;
            setTimeout(function() {
                document.oncontextmenu = function(ev2) {
                    ev2.preventDefault();
                    showCustomMenu(ev2.clientX, ev2.clientY);
                    return false;
                };
            }, 100);
        };

        /* 刷新页面 */
        menuReload.onclick = function(e) {
            e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
            hideCustomMenu();
            window.location.reload();
        };

        /* 下载背景 */
        menuDownloadBg.onclick = function(e) {
            e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
            hideCustomMenu();

            var bgImage = document.body.style.backgroundImage;
            if (bgImage && bgImage !== 'none') {
                var url = bgImage.replace(/url\(['"]?/g, '').replace(/['"]?\)/g, '');
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';
                xhr.onload = function() {
                    if (this.status === 200) {
                        var blob = this.response;
                        var blobUrl = window.URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = 'bing_wallpaper.jpg';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(function() {
                            window.URL.revokeObjectURL(blobUrl);
                        }, 100);
                    } else {
                        alert('下载失败，服务器返回错误');
                    }
                };
                xhr.onerror = function() {
                    alert('背景图下载失败，可能跨域受限');
                };
                xhr.send();
            } else {
                alert('未检测到可下载的背景图！');
            }
        };

        /* 去仓库给 Star */
        menuStar.onclick = function(e) {
            e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
            hideCustomMenu();
            window.open('https://github.com/CNFinder-Linux/F-sousuo', '_blank');
        };

        /* 焦点初始化 */
        setTimeout(function() {
            searchInput.focus();
        }, 300);
    </script>
</body>
</html>
